# Joint limits for jacobian_velctrl's limit-aware solver.
#
# The stock interbotix_xsarm_moveit joint_limits.yaml only carries
# velocity/acceleration limits — position limits live in the URDF, which
# this node does not parse. Without min_position/max_position the solver
# never freezes a joint at its bound and will happily drive a joint past
# the URDF limit, which makes ros2_control deactivate arm_controller.
#
# min_position/max_position below are copied from wx200.urdf.xacro
# (radians). Keep in sync if the URDF limits change.
joint_limits:
  waist:
    min_position: -3.14158
    max_position: 3.14158
    has_velocity_limits: true
    max_velocity: 3.14
    has_acceleration_limits: true
    max_acceleration: 5.0
  shoulder:
    min_position: -2.00713
    max_position: 1.97222
    has_velocity_limits: true
    max_velocity: 3.14
    has_acceleration_limits: true
    max_acceleration: 5.0
  elbow:
    min_position: -1.95477
    max_position: 1.69297
    has_velocity_limits: true
    max_velocity: 3.14
    has_acceleration_limits: true
    max_acceleration: 5.0
  wrist_angle:
    min_position: -1.81514
    max_position: 2.21657
    has_velocity_limits: true
    max_velocity: 3.14
    has_acceleration_limits: true
    max_acceleration: 5.0
  wrist_rotate:
    min_position: -3.14158
    max_position: 3.14158
    has_velocity_limits: true
    max_velocity: 3.14
    has_acceleration_limits: true
    max_acceleration: 5.0
